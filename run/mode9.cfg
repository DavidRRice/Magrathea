#Welcome to MAGRATHEA                                                                    (\_/)
#Authors: Huang C., Rice D.R., Steffen J.H.                                             (•_• )
#Planet interior structure code for astronomers, planetary scientists, mice, and more.   /  < \
#=====================================================================================================================================
#Input Mode 9
#Full Solver with Chemistry
#Solve the interior properties of a planet
#Requires mass of each differentiated layer, surface temperature, and discontinuities
#-------------------------------------------------------------------------------------------------------------------------------------
#Input Mode 9 inputs
input_mode=9
total_mass=1.0	    # Earth masses total (mass of core and mantle will be calculated with elemental ratios)
mass_of_hydro=0.0	# Earth masses in hydrosphere
mass_of_atm=0.0	    # Earth masses in atmosphere
CaMg = 0.07     #Ca/Mg ratio. Earth: 0.07
SiMg = 0.9      #Si/Mg ratio. Earth: 0.9
AlMg = 0.09     #Al/Mg ratio. Earth: 0.09
#Three Coupled knobs for determining location of Fe, Set 2 and comment out the 3rd, all 3 will be calculated and reported
#FeMg = 0.95      #Bulk Fe/Mg ratio. Earth: 0.9
mantle_Mg_num = 0.89     #Mg# of the mantle. Earth: 0.89
RCMF = 0.325    #CMF of the rocky portion of planet (CMF/(MMF+CMF) #Earth: 0.325
#wt fractions of non-Fe elements in core: Earth: 0.05-0.1 (excluding Ni)
wt_fract_S_core = 0.02   #wt. frac. of sulfur in core, affects core density. 
wt_fract_O_core  = 0.01  #wt. frac. of oxygen in core
wt_fract_H_core  = 0.00  #wt. frac. of hydrogen in core
wt_fract_C_core  = 0.00  #wt. frac. of carbon in core
wt_fract_Si_core = 0.05  #wt. frac. of silicon in core. Ignored in mantle's SiMg balance
wt_fract_Ni_core = 0.05  #wt fraction of Ni in core. Earth: 0.05
core_partition_flag = true #partitions LE between solid/liquid core, increases run time
surface_temp=1600	# K, top of planet where enclosed mass equals total mass, #Earth mantle temp ~1600 K
#Temperature of the outer boundary of the inner layer minus the inner boundary of the outer layer. A positive number indicates temperature increases inward. 0 indicates the temperature is continuous at the boundary of layers.
temp_jump_1=0		# Atmosphere to hydrosphere discontinuity in K
temp_jump_2=0		# Hydrosphere to mantle discontinuity in K
temp_jump_3=1500		# Mantle to core discontinuity in K #Earth ~1500 K
output_file="./result/Structure.txt"	# Output file name & location
#-------------------------------------------------------------------------------------------------------------------------------------
#Global Run Options
verbose=true			# Whether to print warnings
P_surface=1E5				# The pressure level that the broad band optical transit radius probes (in microbar)
core_phasedgm="Fe_default" 		# Phase Diagram for the core
mantle_phasedgm="mant_mix"		# Phase Diagram for the mantle, *Must* use mant_mix for this mode
hydro_phasedgm="water_default"	# Phase Diagram for the hydropshere
atm_phasedgm="gas_default"		# Phase Diagram for the atmopshere
ave_rho_core=15		# Initial guess: density of the core is 15, mantle is 5, hydrosphere is 2, and gas is 1E-3 g/cm^3
ave_rho_mantle=5
ave_rho_hydro=2
ave_rho_atm=1E-3
#-------------------------------------------------------------------------------------------------------------------------------------
#Error Tolerances (not recommended to change)
rho_eps_rel=1E-11	# relative error tolerance of the density solver
T_eps_rel=1E-11		# relative error tolerance of the temperature solver for the adiabatic profile
ode_eps_rel0=1E-7 	# relative error tolerance for first round ode integrator (1E-7) used in mode 0
ode_eps_rel1=1E-10 	# relative error tolerance for second round ode integrator (1E-10) used in mode 0
R_eps_rel=2E-5		# relative error tolerance in mode 0 first round radius determination (5E-5).  Should be around sqrt(ode_eps_rel0).
ode_eps_rel2=1E-10 	# relative error tolerance for ode integrator (1E-10) used in mode 1
P_eps_rel=1E-10		# relative error tolerance in mode 1 central pressure determination (1E-10).  Should not be more restrict than ode_eps_rel.
fit_eps_rel=1E-4 	# the relative error tolerance at the fitting point in mode 0 round 2 (1E-4). Should be four orders of magnitudes larger than ode_eps_rel1.
